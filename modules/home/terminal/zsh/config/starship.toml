# Starship is initialized directly from .zshrc; this is a normal Starship config.
add_newline = false
command_timeout = 1200
scan_timeout = 30
palette = "nocturne"

format = """
$os$username$hostname$directory$git_branch$git_status$fill$status$cmd_duration$jobs$nix_shell$container$python$nodejs$rust$golang$java$terraform$aws$gcloud$time
$character"""

[palettes.nocturne]
ink = "#cdd6f4"
muted = "#6c7086"
blue = "#89b4fa"
cyan = "#94e2d5"
green = "#a6e3a1"
yellow = "#f9e2af"
peach = "#fab387"
red = "#f38ba8"
mauve = "#cba6f7"

[os]
disabled = false
style = "bold blue"
format = "[$symbol]($style) "

[os.symbols]
NixOS = ""
Fedora = ""
Linux = ""

[username]
show_always = false
style_user = "bold mauve"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold yellow"
format = "[@$hostname]($style) "

[directory]
style = "bold cyan"
read_only = " "
read_only_style = "red"
truncation_length = 5
truncate_to_repo = true
fish_style_pwd_dir_length = 1
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "~${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "*${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[fill]
symbol = " "

[status]
disabled = false
symbol = "✘"
success_symbol = ""
style = "bold red"
format = "[$symbol $status]($style) "

[cmd_duration]
min_time = 3000
style = "yellow"
format = "[󰔛 $duration]($style) "

[jobs]
symbol = "󰜎"
style = "green"
format = "[$symbol$number]($style) "
number_threshold = 1

[nix_shell]
symbol = " "
style = "bold blue"
format = '[$symbol$state( \($name\))]($style) '

[container]
symbol = "⬢ "
style = "peach"
format = "[$symbol$name]($style) "

[python]
symbol = " "
style = "yellow"
format = '[$symbol$pyenv_prefix$version( \($virtualenv\))]($style) '

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "peach"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "cyan"
format = "[$symbol$version]($style) "

[java]
symbol = " "
style = "red"
format = "[$symbol$version]($style) "

[terraform]
symbol = "󱁢 "
style = "mauve"
format = "[$symbol$workspace]($style) "

[aws]
symbol = "󰸏 "
style = "peach"
format = '[$symbol$profile( \($region\))]($style) '

[gcloud]
symbol = "󱇶 "
style = "blue"
format = '[$symbol$account(@$domain)( \($project\))]($style) '

[time]
disabled = false
time_format = "%I:%M %p"
style = "muted"
format = "[ $time]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold blue)"
vimcmd_replace_one_symbol = "[❮](bold yellow)"
vimcmd_replace_symbol = "[❮](bold yellow)"
vimcmd_visual_symbol = "[V](bold mauve)"
